name: Android APK

# Builds the Flutter app in the cloud and publishes the APKs as a
# GitHub (pre)release, so they can be downloaded straight to a phone.
# Manual only (Actions tab → "Run workflow", or gh workflow run): fixes are
# collected and built once per test round.

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "API base URL baked into the app (leave empty for the app's default)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Generate android/ folder
        run: |
          flutter create --platforms=android --org com.musafirmaak --project-name musafir_maak .
          rm -f test/widget_test.dart

      - name: Patch AndroidManifest (internet, cleartext, intent queries)
        run: |
          python3 - <<'EOF'
          import re, pathlib
          p = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          if "android.permission.INTERNET" not in s:
              s = s.replace("<application", '<uses-permission android:name="android.permission.INTERNET"/>\n    <application', 1)
          if "usesCleartextTraffic" not in s:
              s = s.replace("<application", '<application\n        android:usesCleartextTraffic="true"', 1)
          # url_launcher on Android 11+: links, WhatsApp, phone calls
          extra = (
              '        <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent>\n'
              '        <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="http"/></intent>\n'
              '        <intent><action android:name="android.intent.action.DIAL"/><data android:scheme="tel"/></intent>\n'
          )
          if "<queries>" in s:
              s = s.replace("<queries>", "<queries>\n" + extra, 1)
          else:
              s = s.replace("</manifest>", "    <queries>\n" + extra + "    </queries>\n</manifest>", 1)
          p.write_text(s)
          print(s)
          EOF

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

      - name: Build APKs (release, signed with the debug key)
        run: |
          DEFINE=""
          if [ -n "${{ inputs.api_base_url }}" ]; then
            DEFINE="--dart-define=API_BASE_URL=${{ inputs.api_base_url }}"
          fi
          flutter build apk --release --split-per-abi $DEFINE
          ls -la build/app/outputs/flutter-apk/

      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk
          cp app-arm64-v8a-release.apk     musafir-maak-${{ github.run_number }}-arm64.apk
          cp app-armeabi-v7a-release.apk   musafir-maak-${{ github.run_number }}-arm32-old-phones.apk

      - name: Publish as a GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "APK build ${{ github.run_number }}"
          prerelease: true
          body: |
            Test build from commit ${{ github.sha }}.
            Most phones: download the **arm64** file. Very old phones: the **arm32** one.
            API base URL: `${{ inputs.api_base_url || 'app default' }}`
          files: |
            mobile/build/app/outputs/flutter-apk/musafir-maak-${{ github.run_number }}-arm64.apk
            mobile/build/app/outputs/flutter-apk/musafir-maak-${{ github.run_number }}-arm32-old-phones.apk
