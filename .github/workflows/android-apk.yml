name: Android APK

# Builds the Flutter app in the cloud and publishes the APKs as a
# GitHub (pre)release, so they can be downloaded straight to a phone.
# Manual only (Actions tab → "Run workflow", or gh workflow run): fixes are
# collected and built once per test round.

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "API base URL baked into the app (leave empty for the app's default)"
        required: false
        default: ""
      publish:
        description: "Publish the APKs as a GitHub pre-release (off = compile check only)"
        type: boolean
        required: false
        default: true

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Generate android/ folder
        run: |
          flutter create --platforms=android --org com.musafirmaak --project-name musafir_maak .
          rm -f test/widget_test.dart

      - name: Patch AndroidManifest (internet, cleartext, intent queries)
        run: |
          python3 - <<'EOF'
          import re, pathlib
          p = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          if "android.permission.INTERNET" not in s:
              s = s.replace("<application", '<uses-permission android:name="android.permission.INTERNET"/>\n    <application', 1)
          # Lets the app ask Android not to put it to sleep, so notifications arrive when it's closed.
          if "REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" not in s:
              s = s.replace("<application", '<uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/>\n    <application', 1)
          if "usesCleartextTraffic" not in s:
              s = s.replace("<application", '<application\n        android:usesCleartextTraffic="true"', 1)
          # url_launcher on Android 11+: links, WhatsApp, phone calls
          extra = (
              '        <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent>\n'
              '        <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="http"/></intent>\n'
              '        <intent><action android:name="android.intent.action.DIAL"/><data android:scheme="tel"/></intent>\n'
          )
          if "<queries>" in s:
              s = s.replace("<queries>", "<queries>\n" + extra, 1)
          else:
              s = s.replace("</manifest>", "    <queries>\n" + extra + "    </queries>\n</manifest>", 1)
          # Push notifications: small icon, accent colour, default channel (created in MainActivity).
          meta = (
              '        <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_stat_notify"/>\n'
              '        <meta-data android:name="com.google.firebase.messaging.default_notification_color" android:resource="@color/notify_accent"/>\n'
              '        <meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="default"/>\n'
          )
          # App name under the icon on the phone.
          s = re.sub(r'android:label="[^"]*"', 'android:label="مسافر معاك"', s, count=1)
          if "default_notification_icon" not in s:
              s = s.replace("</application>", meta + "    </application>", 1)
          p.write_text(s)
          print(s)
          EOF

      - name: Android push files (channel, icon)
        run: |
          cp tooling/android/MainActivity.kt android/app/src/main/kotlin/com/musafirmaak/musafir_maak/MainActivity.kt
          mkdir -p android/app/src/main/res/drawable android/app/src/main/res/values
          cp tooling/android/ic_stat_notify.xml android/app/src/main/res/drawable/ic_stat_notify.xml
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources><color name="notify_accent">#15233F</color></resources>\n' > android/app/src/main/res/values/notify_colors.xml
          # Launcher icon (generated by tooling/android/icon; adaptive on Android 8+).
          cp -r tooling/android/icon/* android/app/src/main/res/
          # Firebase needs Android 6.0+ (API 23).
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = maxOf(flutter.minSdkVersion, 23)/' android/app/build.gradle.kts
          grep -n "minSdk" android/app/build.gradle.kts

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

      - name: Sign every build with the shared test key
        # Same key on every build, so a new APK installs over the old one. Copying it to
        # ~/.android/debug.keystore wasn't picked up by Gradle (apk-7 and apk-12 came out with
        # different keys), so the release build type now points at the file explicitly.
        # Test builds only: the Play Store release gets its own upload key.
        run: |
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path("android/app/build.gradle.kts")
          s = p.read_text()
          block = '''
              signingConfigs {
                  create("shared") {
                      storeFile = file("../../tooling/test-debug.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }
          '''
          if 'create("shared")' not in s:
              s = s.replace("    buildTypes {", block + "\n    buildTypes {", 1)
              s = s.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("shared")')
          assert 'getByName("shared")' in s, s
          p.write_text(s)
          print(s)
          PY

      - name: Build APKs (release, signed with the debug key)
        run: |
          DEFINE=""
          if [ -n "${{ inputs.api_base_url }}" ]; then
            DEFINE="--dart-define=API_BASE_URL=${{ inputs.api_base_url }}"
          fi
          # Version code rises with every build so a newer APK always installs over an older one.
          flutter build apk --release --split-per-abi --build-number=${{ github.run_number }} $DEFINE
          ls -la build/app/outputs/flutter-apk/

      - name: Check the signing key didn't change
        run: |
          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          CERT=$($APKSIGNER verify --print-certs build/app/outputs/flutter-apk/app-arm64-v8a-release.apk | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          echo "Signed with $CERT"
          [ "$CERT" = "a82e9239a53fa60987b387ea3c03ac815686a743197d77b122eb9f45fb3c0496" ] || { echo "::error::APK is not signed with the shared test key"; exit 1; }

      - name: Rename APKs
        if: ${{ inputs.publish }}
        run: |
          cd build/app/outputs/flutter-apk
          cp app-arm64-v8a-release.apk     musafir-maak-${{ github.run_number }}-arm64.apk
          cp app-armeabi-v7a-release.apk   musafir-maak-${{ github.run_number }}-arm32-old-phones.apk

      - name: Publish as a GitHub pre-release
        if: ${{ inputs.publish }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "APK build ${{ github.run_number }}"
          prerelease: true
          body: |
            Test build from commit ${{ github.sha }}.
            Most phones: download the **arm64** file. Very old phones: the **arm32** one.
            API base URL: `${{ inputs.api_base_url || 'app default' }}`
          files: |
            mobile/build/app/outputs/flutter-apk/musafir-maak-${{ github.run_number }}-arm64.apk
            mobile/build/app/outputs/flutter-apk/musafir-maak-${{ github.run_number }}-arm32-old-phones.apk
